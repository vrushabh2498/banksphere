spring.application.name=auth-service

server.port=8081

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

// Logging Configuration
logging.level.root=WARN
logging.level.com.banksphere.authservice=INFO
logging.file.name=logs/auth-service.log
logging.pattern.console=%d{HH:mm:ss} [%level] %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# SQL DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/banksphere_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Disable default generated Spring password warning
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Disable open-in-view warning
spring.jpa.open-in-view=false